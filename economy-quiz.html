<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시장경제 내용 확인 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263b;font-family:'Malgun Gothic',sans-serif;font-size:20px}header{background:#245c50;color:white;padding:22px max(20px,calc((100% - 1000px)/2))}header p{margin:6px 0 0;font-size:17px;color:#d4e9df}h1{margin:0;font-size:29px}main{max-width:1000px;margin:24px auto;padding:0 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.card{background:white;border-radius:20px;padding:30px;box-shadow:0 4px 20px #182d4410}h2{font-size:27px;line-height:1.6;margin:12px 0 24px}.tag{font-size:16px;color:#356c5b;font-weight:bold}.choices{display:grid;gap:12px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:15px 22px;font-weight:bold;background:#245c50;color:white;min-height:54px}button:focus-visible,input:focus-visible{outline:4px solid #efb95d;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.option{background:#f1f5fa;color:#17263b;text-align:left;border:2px solid transparent}.option.selected{background:#dfefe8;border-color:#245c50}input{width:100%;border:2px solid #b8c7d4;border-radius:12px;padding:16px;min-height:60px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px}.secondary{background:#e6edf3;color:#24394c}.feedback{padding:18px;border-radius:12px;background:#eef3f9;line-height:1.7;margin-top:20px}.correct{background:#e0f2e6}.wrong{background:#fff0e9}.progress{height:9px;border-radius:9px;background:#dde5ed;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:#4a947a}.review{border-top:1px solid #dce4ed;padding:20px 0;line-height:1.7}.muted{font-size:16px;color:#647487}#result[hidden],#quiz[hidden]{display:none}.score{font-size:45px;color:#245c50;font-weight:bold}@media(max-width:600px){body{font-size:18px}.card{padding:20px}h2{font-size:23px}h1{font-size:24px}.actions{flex-wrap:wrap}}
</style></head><body><header><h1>시장경제 내용 확인 퀴즈</h1><p>6학년 사회 · 교과서 60~63쪽 · 10문항</p></header><main><section id="quiz"><div class="top"><b id="counter"></b><span id="answered" class="muted"></span></div><div class="progress"><div id="fill"></div></div><div class="card"><span class="tag" id="type"></span><h2 id="question"></h2><form id="answerForm"><div id="answer"></div><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button type="button" class="secondary" id="prev">이전</button><button type="submit" id="check">정답 확인</button><button type="button" id="next" hidden>다음</button></div></form></div><p class="muted">답을 입력하거나 고른 뒤 정답을 확인하세요.</p></section><section id="result" class="card" hidden></section></main><script>
const questions=[
{q:'물건이나 서비스의 거래가 이루어지는 곳을 무엇이라고 하나요?',type:'text',answer:'시장',accept:['시장'],why:'시장은 물건이나 서비스의 거래가 이루어지는 곳이에요.'},
{q:'온라인 쇼핑몰도 시장이라고 할 수 있습니다.',type:'choice',options:['O','X'],answer:'O',why:'장소와 관계없이 거래가 이루어지면 시장이라고 할 수 있어요.'},
{q:'경제활동을 함께하며 살림을 꾸려 가는 생활 공동체는 무엇인가요?',type:'text',answer:'가계',accept:['가계'],why:'가계는 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체예요.'},
{q:'기업이 물건이나 서비스를 생산·판매하는 주된 목적은 무엇인가요?',type:'text',answer:'이윤을 얻기 위해',accept:['이윤','이윤을얻기위해','이윤을얻기위해서','이윤추구','이윤을얻는것','이윤을얻으려고','이윤을얻기위해서이다','이익','이익을얻기위해','이익을얻으려고'],why:'기업은 이윤을 얻으려고 물건이나 서비스를 생산하거나 판매해요.'},
{q:'물건이나 서비스를 판매한 수입에서 생산에 들어간 비용을 뺀 금액을 무엇이라고 하나요?',type:'text',answer:'이윤',accept:['이윤'],why:'이윤은 판매 수입에서 생산 비용을 뺀 금액이에요.'},
{q:'시장에서 상품의 가격은 무엇에 따라 정해지나요?',type:'choice',options:['상품 이름의 길이','사람들이 필요로 하는 양과 기업이 제공하는 양','가게 문을 여는 시각'],answer:'사람들이 필요로 하는 양과 기업이 제공하는 양',why:'상품을 필요로 하는 양과 제공하는 양에 따라 가격이 정해져요.'},
{q:'가계와 기업이 시장에서 자유롭게 경쟁하며 경제활동을 하는 방식을 무엇이라고 하나요?',type:'text',answer:'시장경제',accept:['시장경제','시장경제체제'],why:'시장경제에서는 가계와 기업이 자유롭게 경쟁하며 경제활동을 해요.'},
{q:'기업은 경쟁에서 앞서기 위해 더 좋은 물건을 만들려고 노력합니다.',type:'choice',options:['O','X'],answer:'O',why:'기업은 더 많은 물건을 팔기 위해 품질을 높이는 등 경쟁해요.'},
{q:'가계는 기업의 생산 활동에 참여하고 그 대가로 (          )을 얻습니다.',type:'text',answer:'소득',accept:['소득'],why:'가계는 생산 활동에 참여해 소득을 얻고, 그 소득으로 소비해요.'},
{q:'가계의 합리적인 소비에 가까운 것은 무엇인가요?',type:'choice',options:['무조건 가장 싼 물건을 산다.','소득을 고려하여 적은 비용으로 가장 큰 만족을 얻도록 선택한다.','친구가 산 물건을 모두 따라 산다.'],answer:'소득을 고려하여 적은 비용으로 가장 큰 만족을 얻도록 선택한다.',why:'가격만 보지 않고 소득과 만족을 함께 고려하는 것이 중요해요.'}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const normalize=s=>s.replace(/[\s.!?。]/g,'');let index=0;let responses=questions.map(()=>({value:'',checked:false,correct:false}));
function render(){const q=questions[index],r=responses[index];$('#counter').textContent=`${index+1} / ${questions.length}`;$('#answered').textContent=`확인한 문제 ${responses.filter(x=>x.checked).length}개`;$('#fill').style.width=`${(index+1)/questions.length*100}%`;$('#type').textContent=q.type==='text'?'주관식':'선택형';$('#question').textContent=q.q;$('#answer').innerHTML=q.type==='text'?`<label class="muted" for="textAnswer">답</label><input id="textAnswer" aria-label="답 입력" autocomplete="off" spellcheck="false" value="${esc(r.value)}" ${r.checked?'disabled':''}>`:`<div class="choices">${q.options.map((o,i)=>`<button type="button" class="option ${r.value===o?'selected':''}" data-option="${i}" aria-pressed="${r.value===o}" ${r.checked?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;$('#prev').disabled=index===0;$('#check').hidden=r.checked;$('#next').hidden=!r.checked;$('#next').textContent=index===questions.length-1?'결과 보기':'다음';$('#feedback').className=r.checked?`feedback ${r.correct?'correct':'wrong'}`:'';$('#feedback').innerHTML=r.checked?`<b>${r.correct?'정답이에요!':'정답을 확인해요.'}</b><br>정답: ${esc(q.answer)}<br>${esc(q.why)}`:'';}
$('#answer').addEventListener('input',e=>{responses[index].value=e.target.value});$('#answer').addEventListener('click',e=>{const b=e.target.closest('[data-option]');if(!b)return;responses[index].value=questions[index].options[+b.dataset.option];render()});$('#answerForm').addEventListener('submit',e=>{e.preventDefault();const q=questions[index],r=responses[index];if(r.checked)return;if(!r.value.trim()){$('#feedback').className='feedback';$('#feedback').textContent='답을 먼저 입력하거나 골라 주세요.';return}r.checked=true;r.correct=q.type==='text'?q.accept.some(a=>normalize(a)===normalize(r.value)):r.value===q.answer;render()});$('#prev').onclick=()=>{if(index>0){index--;render()}};$('#next').onclick=()=>{if(index<questions.length-1){index++;render()}else showResult()};
function showResult(){$('#quiz').hidden=true;$('#result').hidden=false;const score=responses.filter(r=>r.correct).length;$('#result').innerHTML=`<h2>퀴즈 결과</h2><div class="score">${score} / 10</div><p>틀린 문제의 정답과 설명을 확인해 보세요.</p>${questions.map((q,i)=>`<div class="review"><b>${i+1}. ${esc(q.q)}</b><br>${responses[i].correct?'✓ 정답':'다시 확인'} · 내 답: ${esc(responses[i].value)}<br>정답: ${esc(q.answer)}<br><span class="muted">${esc(q.why)}</span></div>`).join('')}<button id="retry">다시 풀기</button>`;$('#retry').onclick=()=>{index=0;responses=questions.map(()=>({value:'',checked:false,correct:false}));$('#quiz').hidden=false;$('#result').hidden=true;render();window.scrollTo(0,0)};window.scrollTo(0,0)}render();
</script></body></html>
